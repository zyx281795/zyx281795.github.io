<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中醫藥材資料庫與AI聊天系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            height: 100vh;
        }

        .main-content {
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .tab-button {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #6c757d;
            transition: all 0.3s ease;
        }

        .tab-button.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .tab-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .tab-pane {
            display: none;
            height: 100%;
        }

        .tab-pane.active {
            display: flex;
            flex-direction: column;
        }

        /* 中藥材資料庫樣式 */
        .herb-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            background: #f8f9fa;
        }

        .herb-button {
            padding: 12px 8px;
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .herb-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            background: linear-gradient(135deg, #a8e6cf 0%, #7fcdcd 100%);
        }

        .herb-display {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            min-height: 300px;
        }

        .image-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .image-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .herb-image {
            max-width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            background: white;
            padding: 10px;
        }

        .image-placeholder {
            width: 200px;
            height: 200px;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            color: #6c757d;
            font-size: 16px;
            text-align: center;
        }

        .nav-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(102, 126, 234, 0.8);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .nav-button:hover {
            background: rgba(102, 126, 234, 1);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-button:disabled {
            background: rgba(108, 117, 125, 0.5);
            cursor: not-allowed;
            transform: translateY(-50%);
        }

        .nav-button.prev {
            left: -50px;
        }

        .nav-button.next {
            right: -50px;
        }

        .image-info {
            margin-top: 10px;
            color: #6c757d;
            font-size: 14px;
            text-align: center;
        }

        .text-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        .herb-title {
            font-size: 20px;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .herb-text {
            line-height: 1.8;
            color: #4a5568;
            font-size: 14px;
            white-space: pre-wrap;
        }

        /* 聊天介面樣式 */
        .chat-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 15px 15px 0 0;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f8f9fa;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .message.bot {
            align-self: flex-start;
            background: white;
            color: #2d3748;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .chat-input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e2e8f0;
            border-radius: 0 0 15px 15px;
        }

        .chat-input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            resize: none;
            font-family: inherit;
            font-size: 14px;
            min-height: 44px;
            max-height: 100px;
            transition: border-color 0.3s ease;
        }

        .chat-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .file-input-label {
            padding: 10px;
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .file-input-label:hover {
            background: #e2e8f0;
        }

        .file-input {
            display: none;
        }

        .send-button {
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
        }

        .send-button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
        }

        .send-button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-message {
            text-align: center;
            color: #6c757d;
            padding: 40px 20px;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                gap: 10px;
                padding: 10px;
            }
            
            .herb-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
            
            .herb-display {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-content">
            <div class="header">
                <h1>中醫藥材資料庫系統</h1>
                <p>Traditional Chinese Medicine Database</p>
            </div>
            
            <div class="tabs">
                <button class="tab-button active" onclick="switchTab('herbs')">中藥材資料庫</button>
                <button class="tab-button" onclick="switchTab('chat')">AI 聊天助手</button>
            </div>
            
            <div class="tab-content">
                <div id="herbs-tab" class="tab-pane active">
                    <div class="herb-grid" id="herbGrid">
                        <!-- 中藥材按鈕將由 JavaScript 生成 -->
                    </div>
                    
                    <div class="herb-display" id="herbDisplay">
                        <div class="image-section">
                            <div class="image-container">
                                <button class="nav-button prev" id="prevBtn" onclick="changeImage(-1)" disabled>‹</button>
                                <div class="image-placeholder" id="imagePlaceholder">
                                    請選擇中藥材查看圖片
                                </div>
                                <button class="nav-button next" id="nextBtn" onclick="changeImage(1)" disabled>›</button>
                            </div>
                            <div class="image-info" id="imageInfo"></div>
                        </div>
                        <div class="text-section">
                            <div class="herb-title">中藥材資訊</div>
                            <div class="herb-text" id="herbText">
                                請點擊左側的中藥材按鈕，查看詳細的功效與說明。
                            </div>
                        </div>
                    </div>
                </div>
                
                <div id="chat-tab" class="tab-pane">
                    <div class="welcome-message">
                        <h3> 多模態 AI 聊天助手</h3>
                        <p>支援文字和圖片輸入，專精於中醫藥材諮詢</p>
                        <small>（此功能預留接口，待模型串接完成）</small>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="chat-container">
            <div class="chat-header">
                <h2> 中醫 AI 助手</h2>
                <p>多模態智能諮詢</p>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    👋 您好！我是中醫 AI 助手，可以為您解答中藥材相關問題。您可以輸入文字或上傳圖片進行諮詢。
                </div>
            </div>
            
            <div class="chat-input-area">
                <div class="chat-input-container">
                    <label for="fileInput" class="file-input-label" title="上傳圖片">
                        📷
                    </label>
                    <input type="file" id="fileInput" class="file-input" accept="image/*" onchange="handleFileUpload(this)">
                    
                    <textarea 
                        id="chatInput" 
                        class="chat-input" 
                        placeholder="請輸入您的問題..."
                        rows="1"
                        onkeypress="handleKeyPress(event)"
                        oninput="autoResize(this)"
                    ></textarea>
                    
                    <button class="send-button" onclick="sendMessage()" id="sendButton">
                        ➤
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 生成中藥材按鈕
        function generateHerbButtons() {
            const herbGrid = document.getElementById('herbGrid');
            
            for (let i = 1; i <= 300; i++) {
                const button = document.createElement('button');
                button.className = 'herb-button';
                button.textContent = `中藥材 ${i}`;
                button.onclick = () => loadHerbData(i);
                herbGrid.appendChild(button);
            }
        }
        
        /* ===== 常數 ===== */
        const IMAGES_DIR = './藥材圖片';
        const TEXT_DIR   = './藥材功效更改版';

        /* ===== 全域狀態（供左右鍵切換）===== */
        let currentHerbId = null;
        let currentImages = []; // 路徑陣列
        let currentIndex  = 0;

        /* ===== 共用：檔案是否存在（HEAD）===== */
        async function fileExists(url) {
        try {
            const res = await fetch(encodeURI(url), { method: 'HEAD' });
            return res.ok;
        } catch {
            return false;
        }
        }

        /* ===== 掃描某藥材的所有可用圖片 =====
        - 允許中間缺號
        - 最多掃到 -30，連續 miss 5 次就收手（已有找到的前提下） */
        async function buildImageList(herbId) {
        const exts = ['jpg','jpeg','png','JPG','JPEG','PNG'];
        const maxNum = 30;
        const stopAfterMiss = 5;

        const list = [];
        let missStreak = 0;

        for (let i = 1; i <= maxNum; i++) {
            let found = false;

            for (const ext of exts) {
            // 子資料夾優先：藥材圖片/{id}/{id}-{i}.{ext}
            const p1 = `${IMAGES_DIR}/${herbId}/${herbId}-${i}.${ext}`;
            if (await fileExists(p1)) { list.push(p1); found = true; break; }

            // 平放備用：藥材圖片/{id}-{i}.{ext}
            const p2 = `${IMAGES_DIR}/${herbId}-${i}.${ext}`;
            if (await fileExists(p2)) { list.push(p2); found = true; break; }
            }

            if (found) {
            missStreak = 0;
            } else {
            missStreak++;
            if (list.length > 0 && missStreak >= stopAfterMiss) break;
            }
        }
        return list;
        }

        /* ===== 依 currentImages/currentIndex 渲染圖片 ===== */
        function renderImage() {
        const imagePlaceholder = document.getElementById('imagePlaceholder');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        if (!currentImages.length) {
            imagePlaceholder.innerHTML = `<div class="image-placeholder">
            找不到圖片<br>請確認 ${IMAGES_DIR}/${currentHerbId}/${currentHerbId}-1.(jpg/jpeg/png)
            </div>`;
            prevBtn.disabled = true;
            nextBtn.disabled = true;
            return;
        }

        // 邊界保護
        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex >= currentImages.length) currentIndex = currentImages.length - 1;

        const img = document.createElement('img');
        img.className = 'herb-image';
        img.src = encodeURI(currentImages[currentIndex]);
        img.alt = `中藥材 ${currentHerbId}`;

        imagePlaceholder.innerHTML = '';
        imagePlaceholder.appendChild(img);

        // 有 2 張以上才開啟左右鍵；切換的「循環」在 changeImage 中處理
        const multi = currentImages.length > 1;
        prevBtn.disabled = !multi;
        nextBtn.disabled = !multi;
        }

        /* ===== 左右切換（循環播放）===== */
        function changeImage(delta) {
        if (!currentImages.length) return;
        currentIndex += delta;
        if (currentIndex < 0) currentIndex = currentImages.length - 1;
        if (currentIndex >= currentImages.length) currentIndex = 0;
        renderImage();
        }

        /* ===== 載入某個藥材（圖片 + 文字）===== */
        async function loadHerbData(herbId) {
        const imagePlaceholder = document.getElementById('imagePlaceholder');
        const herbText = document.getElementById('herbText');
        const titleEl = document.querySelector('.herb-title');

        currentHerbId = herbId;
        currentImages = [];
        currentIndex = 0;

        imagePlaceholder.innerHTML = '載入中...';
        herbText.textContent = '載入資料中...';
        titleEl.textContent = `中藥材 ${herbId} - 功效與說明`;

        // 圖片：建立清單並顯示第一張（若想隨機顯示第一張，打開下一行）
        currentImages = await buildImageList(herbId);
        // currentIndex = Math.floor(Math.random() * currentImages.length) || 0;
        renderImage();

        // 文字
        try {
            const textUrl = `${TEXT_DIR}/${herbId}.txt`;
            const res = await fetch(encodeURI(textUrl));
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const txt = await res.text();
            herbText.textContent = txt.trim() || '（此藥材暫無文字說明）';
        } catch (e) {
            herbText.textContent = '⚠ 無法載入文字資料';
        }
        }

        /* ===== 標籤切換（保留你的寫法）===== */
        function switchTab(tabName) {
        document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
        if (window.event && window.event.target) window.event.target.classList.add('active');
        document.getElementById(tabName + '-tab').classList.add('active');
        }

        /* ===== 聊天功能（原樣保留）===== */
        function sendMessage() {
        const input = document.getElementById('chatInput');
        const message = input.value.trim();
        if (!message) return;
        addMessage(message, 'user');
        input.value = '';
        autoResize(input);
        setTimeout(() => {
            const responses = [
            '感謝您的提問！由於模型尚未完成串接，目前無法提供具體回答。請稍後再試。',
            '這是一個很好的中醫相關問題！待多模態模型串接完成後，我將能為您提供專業的解答。',
            '您的問題已收到。目前系統正在準備中，敬請期待完整功能上線！',
            '抱歉，AI 模型接口還在開發中。未來我將能夠分析您上傳的中藥材圖片並提供專業建議。'
            ];
            addMessage(responses[Math.floor(Math.random()*responses.length)], 'bot');
        }, 1000);
        }
        function addMessage(text, sender) {
        const messagesContainer = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender}`;
        messageDiv.textContent = text;
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        function handleKeyPress(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
        }
        function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
        }
        function handleFileUpload(input) {
        const file = input.files[0];
        if (file) {
            addMessage(`📷 已上傳圖片：${file.name}（預留功能，待模型串接）`, 'user');
            setTimeout(() => addMessage('收到您上傳的圖片！多模態分析功能開發中，敬請期待。', 'bot'), 500);
            input.value = '';
        }
        }

        /* ===== 初始化 ===== */
        document.addEventListener('DOMContentLoaded', function () {
        generateHerbButtons();
        // 右側文字預設提示
        const herbText = document.getElementById('herbText');
        herbText.textContent = '請點擊上方的「中藥材」按鈕，我會顯示其圖片與功效說明。';
        });
    </script>
</body>
</html>
